<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            width: 30px;
            text-align: center;
        }
        th.ipt{
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="ipt" scope="col">Área</th>
                <th rowspan="2" class="ipt" scope="col">Disciplinas</th>
                <th colspan="2" class="ipt" scope="colgroup">Notas</th>
                <th rowspan="2" class="ipt" scope="col">Média</th>
            </tr>
            <tr>
                <th class="ipt" scope="col">Nota 1</th>
                <th class="ipt" scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>8.5</td>
                <td>7.3</td>
                <td>7.9</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>8.5</td>
                <td>6.5</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>7.0</td>
                <td>8.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>10.0</td>
                <td>8.5</td>
                <td>9.25</td>
            </tr>
            <tr>
                <th class="ipt" colspan="4" scope="row">Média de Exatas</th>
                <th class="ipt">8.5</th>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>8.0</td>
                <td>7.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>7.5</td>
                <td>8.0</td>
                <td>7.75</td>
            </tr>
            <tr>
                <th class="ipt" colspan="4" scope="row">Média de Humanas</th>
                <th class="ipt">7.625</th>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
