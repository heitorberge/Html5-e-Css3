<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-rows: 100px 50px 150px 50px;
            grid-template-columns: 3fr 1fr;
            grid-template-areas: 
                "topo topo"
                "menu menu"
                "principal secundario"
                "rodape rodape";
            gap: 5px;
        }
        .topo {
            grid-area: topo;
            border: 1px solid black;
        }
        .menu {
            grid-area: menu;
            border: 1px solid black;
        }
        .principal {
            grid-area: principal;
            border: 1px solid black;
        }
        .secundario {
            grid-area: secundario;
            border: 1px solid black;
        }
        .rodape {
            grid-area: rodape;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">topo</div>
        <div class="menu">menu</div>
        <div class="principal">principal</div>
        <div class="secundario">secundário</div>
        <div class="rodape">rodapé</div>
    </div>
</body>
</html>
